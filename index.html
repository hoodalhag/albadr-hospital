<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>(Form) HTML </title>
</head>
<body>
    <form>
        <label for="name">name:</label>
        <input type="text" id="name" name="name"><br><br>


        <label for="pass">pass:</label>
        <input type="password" id="pass" name="pass" value="***"><br><br>

        <label for="level">level:</label>
        <select id="level" name="level">
            <option value="Beginner">Beginner</option>
            <option value="intermadiate">intermadiate</option>
            <option value="advanced">advanced</option>
            <option value="expert">expert</option>
        </select><br><br>


        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">male</label>
        
        <input type="radio" id="femal" name="gender" value="femal">
        <label for="femal">Femal</label><br><br>


        <label>Hopes:</label><br>
        <input type="checkbox" id="swim" name="hopes" value="swim">
        <label for="swim">السباحة</label><br>
        
        <input type="checkbox" id="shoot" name="hopes" value="shoot">
        <label for="shoot">الرماية</label><br>
        
        <input type="checkbox" id="read" name="hopes" value="read">
        <label for="read">القراءة</label><br><br>


        <label for="comment">Comment:</label><br>
        <textarea id="comment" name="comment" rows="5" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
